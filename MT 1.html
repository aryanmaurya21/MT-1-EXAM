<!DOCTYPE html>
<html>
<head>
    <title>Shopping Bill</title>
</head>
<body>

    <h1 align="center">Shopping Bill</h1>

    <table border="1" align="center"
           cellpadding="10" cellspacing="0"
           width="100%">

        <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price (₹)</th>
            <th>Amount (₹)</th>
        </tr>

        <tr align="center">
            <td>Notebook</td>
            <td>2</td>
            <td>50</td>
            <td>100</td>
        </tr>

        <tr align="center">
            <td>Pen</td>
            <td>5</td>
            <td>10</td>
            <td>50</td>
        </tr>

        <tr align="center">
            <td>Book</td>
            <td>1</td>
            <td>200</td>
            <td>200</td>
        </tr>

        <tr align="center">
            <td>Bag</td>
            <td>1</td>
            <td>500</td>
            <td>500</td>
        </tr>

        <tr>
            <th colspan="3">Total</th>
            <th>850</th>
        </tr>

    </table>

</body>
</html>
